<title>西日本5県 旅の候補帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 左に動く地図（固定）、右に写真カード。上部に県・ジャンルの絞り込み。スマホは地図→カードの縦積み */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --ink:#17212A; --muted:#5A6971; --line:#DCE2E3;
  --sea:#D3E4EA; --land:#E9ECE6; --land-other:#E0E2DD; --accent:#D2462E; --accent-ink:#FFFFFF;
  --c-zekkei:#1E8296; --c-rekishi:#A8392C; --c-machi:#6550A6; --c-onsen:#C9761F; --c-gourmet:#B8406F;
  --shadow:0 1px 2px rgba(23,33,42,.06),0 4px 14px rgba(23,33,42,.06);
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1519; --surface:#172028; --ink:#E6ECEE; --muted:#9AA9B0; --line:#2A3740;
  --sea:#122630; --land:#26323A; --land-other:#1D272E; --accent:#EE6A4F; --accent-ink:#1A0F0C;
  --c-zekkei:#3FB3C7; --c-rekishi:#E0705F; --c-machi:#A08EE0; --c-onsen:#E9A050; --c-gourmet:#E77AA4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1519; --surface:#172028; --ink:#E6ECEE; --muted:#9AA9B0; --line:#2A3740;
  --sea:#122630; --land:#26323A; --land-other:#1D272E; --accent:#EE6A4F; --accent-ink:#1A0F0C;
  --c-zekkei:#3FB3C7; --c-rekishi:#E0705F; --c-machi:#A08EE0; --c-onsen:#E9A050; --c-gourmet:#E77AA4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto}

header.top{padding-block:28px 18px;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:end;justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--muted);font-weight:700}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4vw,44px);line-height:1.15;margin:4px 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:60ch}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.count{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.count i{width:9px;height:9px;border-radius:50%;background:var(--pc)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button i{width:9px;height:9px;border-radius:50%;background:var(--pc,var(--muted))}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--bg)}
.tools{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.tools input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;width:180px;max-width:100%}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.toggle input{accent-color:var(--accent);width:16px;height:16px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;margin-top:18px;align-items:start}
.mapbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);background:var(--sea);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
#map{display:block;width:100%;height:auto;max-height:calc(100vh - 110px);touch-action:manipulation}
.sea{fill:var(--sea)}
.land{fill:var(--land-other);stroke:var(--bg);stroke-width:.8;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.land[class*="p-"]{fill:var(--land);stroke:var(--line);stroke-width:1.2}
.land.focus{fill:color-mix(in srgb,var(--pc) 14%,var(--land))}
.plabel{font-family:var(--f-display);font-weight:800;fill:var(--muted);opacity:.55;text-anchor:middle;font-size:26px;letter-spacing:.15em;pointer-events:none}
.slabel{fill:var(--muted);opacity:.45;font-size:16px;letter-spacing:.4em;text-anchor:middle;pointer-events:none}
.pin{cursor:pointer}
.pin circle{stroke:var(--surface);transition:r .15s}
.pin circle.ring{stroke:none}
.pin.voted circle.ring{fill:none;stroke:var(--accent);stroke-width:2.2}
.pin.dim{opacity:.13;pointer-events:none}
.pin.hot circle.dot{stroke:var(--ink)}
.maptip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:4px 10px;border-radius:8px;transform:translate(-50%,calc(-100% - 12px));white-space:nowrap}
.mapcap{position:absolute;left:12px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--surface) 88%,transparent);padding:6px 10px;border-radius:10px}
.mapcap span{display:flex;align-items:center;gap:5px}
.mapcap i{width:10px;height:10px;border-radius:50%;background:var(--cc)}
.reset{position:absolute;right:12px;top:12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700;cursor:pointer}

.rank{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:18px}
.rank h2{font-family:var(--f-display);font-size:20px;margin:0 0 2px}
.rank .sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.rank ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rank li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;cursor:pointer;padding:4px 6px;border-radius:8px}
.rank li:hover{background:var(--bg)}
.rank .n{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);text-align:right}
.rank .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .who{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.rank .v{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.rank .empty{color:var(--muted);font-size:14px}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}

.resultbar{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px;color:var(--muted);font-size:13px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:border-color .15s,transform .15s;scroll-margin-top:80px}
.card.hot{border-color:var(--accent);transform:translateY(-2px)}
.ph{position:relative;aspect-ratio:16/10;max-width:100%;background:color-mix(in srgb,var(--pc) 16%,var(--surface));overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .noimg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--pc);opacity:.7;padding:12px;text-align:center}
.badge{position:absolute;left:10px;top:10px;background:var(--pc);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.cb{padding:12px 14px 12px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.cat{color:var(--cc);border:1.5px solid var(--cc);border-radius:6px;padding:0 7px;font-size:12px}
.card h3{font-size:17.5px;margin:0;line-height:1.35}
.card p.d{margin:0;font-size:14px;color:var(--ink);opacity:.86;flex:1}
.vote{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.vbtn{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:3px 12px 3px 9px;font-weight:700;font-size:13.5px;cursor:pointer}
.vbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.vbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vbtn[aria-pressed="true"] svg{fill:currentColor}
.voters{font-size:12px;color:var(--muted);min-width:0}
.links{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
.links a{color:var(--muted)}
.links .cr{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-list{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}
footer{margin-top:32px;color:var(--muted);font-size:12px}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .mapbox{position:relative;top:0}
  .toolbar{position:static}
  #map{max-height:70vh}
  .tools{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div>
    <div class="eyebrow">福岡・広島・山口・島根・鳥取</div>

  if (state.pref !== 'all' && s.pref !== state.pref) return false;
  if (state.cat !== 'all' && s.cat !== state.cat) return false;
  if (state.q && !(s.name + s.desc + (s.where||'')).includes(state.q)) return false;
  if (state.onlyVoted && !(votes[s.id]?.length)) return false;
  return true;
}
function voterNames(id){ return (votes[id] || []).map(u => u === myId ? 'あなた' : (names[u] || '誰か')); }

function render(){
  prefSeg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state.pref));
  catSeg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state.cat));
  const list = $('#cards'); list.replaceChildren();
  let n = 0;
  // 票が多い順 → 元の順
  const order = DATA.spots.slice().sort((a,b) => (votes[b.id]?.length||0) - (votes[a.id]?.length||0));
  for (const s of (state.onlyVoted ? order : DATA.spots)) {
    const ok = matches(s);
    pinEls[s.id].classList.toggle('dim', !ok);
    pinEls[s.id].classList.toggle('voted', !!votes[s.id]?.length);
    if (!ok) continue;
    n++;
    const c = cardEls[s.id], cnt = votes[s.id]?.length || 0, mine = myPicks.has(s.id);
    c.vbtn.setAttribute('aria-pressed', mine);
    c.vbtn.querySelector('.vn').textContent = cnt ? cnt : '';
    c.voters.textContent = cnt ? voterNames(s.id).join('・') : '';
    list.append(c.card);
  }
  if (!n) list.append(el('div', {className:'empty-list', textContent: state.onlyVoted ? 'まだ「行きたい」が付いた場所はありません。カードのボタンを押してみてください。' : '条件に合う場所がありません。絞り込みを変えてみてください。'}));
  $('#resultCount').textContent = `${n}件を表示中`;
  sizePins();
  renderRank();
}
function renderRank(){
  const ol = $('#rankList'); ol.replaceChildren();
  const ranked = Object.entries(votes).filter(([,v]) => v.length).sort((a,b) => b[1].length - a[1].length).slice(0, 10);
  if (!ranked.length) { const li = el('li', {className:'empty', textContent:'まだ票がありません。カードの「行きたい」を押すと、ここに並びます。'}); li.style.display = 'block'; li.style.cursor = 'default'; ol.append(li); return; }
  ranked.forEach(([id, v], i) => {
    const s = byId[id]; if (!s) return;
    const nm = el('span', {className:'nm'}, s.name, el('span', {className:'who', textContent: `${DATA.prefs[s.pref].short}・${voterNames(id).join('、')}`}));
    const li = el('li', {}, el('span', {className:'n', textContent: i+1}), nm, el('span', {className:'v', textContent:`${v.length}票`}));
    li.onclick = () => focusCard(id);
    ol.append(li);
  });
}

/* ---------- 票（共有） ---------- */
const LS = 'tabi-kouho-picks';
function loadLocal(){ try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch { return []; } }
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify([...myPicks])); } catch {} }
let writing = false, pendingWrite = false;
async function toggleVote(id){
  if (myPicks.has(id)) myPicks.delete(id); else myPicks.add(id);
  if (!shared) {
    votes = {}; for (const p of myPicks) votes[p] = ['me']; myId = 'me';
    saveLocal(); render(); return;
  }
  const mine = myPicks.has(id); const arr = new Set(votes[id] || []);
  mine ? arr.add(myId) : arr.delete(myId); votes[id] = [...arr];   // 先に画面へ反映
  render(); writeMine();
}
async function writeMine(){
  if (writing) { pendingWrite = true; return; }
  writing = true;
  try { await db.collection('picks').doc(myId).set({spots:[...myPicks], updatedAt: Date.now()}); $('#syncNote').textContent = '票はこのページを開いた全員で共有されています。'; }
  catch (e) { $('#syncNote').textContent = '票を保存できませんでした（閲覧のみの権限かもしれません）。'; }
  writing = false;
  if (pendingWrite) { pendingWrite = false; writeMine(); }
}
async function resolveNames(){
  if (!user) return;
  const ids = [...new Set(Object.values(votes).flat())].filter(u => u !== myId && !(u in names));
  if (!ids.length) return;
  try { const ps = await user.profiles(ids); for (const id of ids) names[id] = ps?.[id]?.name || ''; render(); } catch {}
}
async function connect(){
  const timer = setTimeout(() => { if (!shared) $('#syncNote').textContent = '票の共有につながりませんでした。この端末にだけ保存します。'; }, 10000);
  try {
    db = await window.claude?.use?.('db');
    user = await window.claude?.use?.('user');
    if (!db || !user) throw 0;
    myId = await user.id();
    if (!myId) throw 0;
    shared = true;
    db.collection('picks').onSnapshot(snap => {
      clearTimeout(timer);
      const v = {};
      for (const d of snap.docs) { const sp = d.data()?.spots; if (Array.isArray(sp)) for (const id of sp) if (byId[id]) (v[id] ||= []).push(d.id); }
      votes = v;
      if (!writing && !pendingWrite) myPicks = new Set(Object.keys(v).filter(id => v[id].includes(myId)));
      $('#syncNote').textContent = '票はこのページを開いた全員で共有されています。';
      render(); resolveNames();
    }, () => { clearTimeout(timer); $('#syncNote').textContent = '票を読み込めませんでした。時間をおいて開き直してください。'; });
  } catch {
    clearTimeout(timer);
    shared = false; myPicks = new Set(loadLocal()); votes = {}; for (const p of myPicks) votes[p] = ['me']; myId = 'me';
    $('#syncNote').textContent = 'ログインしていないため、票はこの端末にだけ保存されます。';
    render();
  }
}
render(); zoomTo('all'); connect();
window.addEventListener('resize', () => { sizePins(); showTip(state.hot); });
</script>
